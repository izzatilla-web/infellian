<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Dark Radial Tech Background Glow -->
    <radialGradient id="showreelBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#121212" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonReel" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orange Gradient -->
    <linearGradient id="reelOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7722"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="700" fill="url(#showreelBg)"/>

  <!-- Minimal Cyber Tech Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <path d="M0 175 H1200 M0 350 H1200 M0 525 H1200" />
    <path d="M300 0 V700 M600 0 V700 M900 0 V700" />
  </g>

  <!-- Abstract 3D Glass & Mesh Visuals in Background -->
  <g opacity="0.35">
    <rect x="250" y="150" width="700" height="400" rx="32" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" transform="rotate(-4 600 350)"/>
    <rect x="280" y="130" width="640" height="440" rx="32" fill="#222222" fill-opacity="0.6" stroke="#ff5500" stroke-opacity="0.3" stroke-width="2" transform="rotate(3 600 350)"/>
  </g>

  <!-- Glowing Tech Code Particles -->
  <g fill="#ff5500" opacity="0.6" filter="url(#neonReel)">
    <circle cx="220" cy="220" r="6" />
    <circle cx="980" cy="180" r="8" />
    <circle cx="1020" cy="520" r="5" />
    <circle cx="180" cy="540" r="7" />
  </g>

  <!-- Abstract Code Line Mockups -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round">
    <line x1="360" y1="260" x2="480" y2="260" />
    <line x1="360" y1="290" x2="560" y2="290" />
    <line x1="360" y1="320" x2="420" y2="320" />

    <line x1="720" y1="420" x2="840" y2="420" />
    <line x1="680" y1="450" x2="840" y2="450" />
  </g>
</svg>
