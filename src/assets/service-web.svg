<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowWeb" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#141414" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7733"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGlowWeb)"/>

  <!-- Minimalist Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <path d="M0 300 H1600 M0 600 H1600" />
    <path d="M400 0 V1000 M800 0 V1000 M1200 0 V1000" />
  </g>

  <!-- 3D Layered Web Browser & UI Elements -->
  <g filter="url(#shadow)">
    <!-- Back Layer Browser Frame -->
    <rect x="350" y="250" width="700" height="450" rx="24" fill="#1b1b1b" stroke="#333333" stroke-width="2" transform="rotate(-8 700 475)"/>
    
    <!-- Front Layer Glass Web Card -->
    <rect x="550" y="280" width="750" height="480" rx="24" fill="#222222" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" transform="rotate(5 925 520)"/>

    <!-- Browser Dots -->
    <g transform="rotate(5 925 520)">
      <circle cx="590" cy="320" r="7" fill="#ff5555"/>
      <circle cx="610" cy="320" r="7" fill="#ffbb33"/>
      <circle cx="630" cy="320" r="7" fill="#00cc66"/>
      <line x1="570" y1="345" x2="1260" y2="345" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

      <!-- Web Hero Layout Mockup Elements -->
      <!-- Hero Headline Bar -->
      <rect x="610" y="380" width="340" height="24" rx="6" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="610" y="415" width="240" height="18" rx="5" fill="#ffffff" fill-opacity="0.5"/>
      
      <!-- Subtitle Lines -->
      <rect x="610" y="450" width="420" height="10" rx="4" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="610" y="468" width="320" height="10" rx="4" fill="#ffffff" fill-opacity="0.2"/>

      <!-- Glowing CTA Button Capsule -->
      <rect x="610" y="505" width="160" height="40" rx="20" fill="url(#orangeGrad)" filter="url(#neonGlow)"/>
      <rect x="640" y="521" width="80" height="8" rx="4" fill="#ffffff"/>

      <!-- Card Grids -->
      <rect x="610" y="575" width="190" height="120" rx="14" fill="#181818" stroke="#333333" stroke-width="1.5"/>
      <rect x="820" y="575" width="190" height="120" rx="14" fill="#181818" stroke="#333333" stroke-width="1.5"/>
      <rect x="1030" y="575" width="190" height="120" rx="14" fill="#ff5500" fill-opacity="0.15" stroke="#ff5500" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>

    <!-- Floating 3D Accent Sphere -->
    <circle cx="340" cy="680" r="70" fill="url(#orangeGrad)" filter="url(#neonGlow)"/>
    <circle cx="1320" cy="240" r="45" fill="#252525" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
