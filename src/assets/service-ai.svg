<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1a1a1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Core Spheres -->
    <radialGradient id="aiCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffaa66"/>
      <stop offset="40%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#992200"/>
    </radialGradient>

    <radialGradient id="glassSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1000" fill="url(#bgGlow)"/>

  <!-- Minimalist Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <path d="M0 200 H1600 M0 400 H1600 M0 600 H1600 M0 800 H1600" />
    <path d="M320 0 V1000 M640 0 V1000 M960 0 V1000 M1280 0 V1000" />
  </g>

  <!-- Abstract 3D Geometric AI Nodes & Composition -->
  <g filter="url(#softShadow)">
    <!-- Back Floating Matte Cube -->
    <rect x="250" y="220" width="220" height="220" rx="30" fill="#1f1f1f" stroke="#333333" stroke-width="2" transform="rotate(15 360 330)"/>

    <!-- Outer Translucent Orbit Ring -->
    <ellipse cx="800" cy="500" rx="420" ry="220" fill="none" stroke="#ff5500" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="12 12" filter="url(#neonGlow)" transform="rotate(-18 800 500)"/>

    <!-- Secondary Accent Ring -->
    <ellipse cx="800" cy="500" rx="300" ry="140" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" transform="rotate(25 800 500)"/>

    <!-- Floating AI Core Sphere -->
    <circle cx="800" cy="500" r="140" fill="url(#aiCore)" filter="url(#neonGlow)"/>

    <!-- Translucent Glass Sphere Overlay -->
    <circle cx="680" cy="380" r="90" fill="url(#glassSphere)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Additional Floating Geometric Elements -->
    <rect x="1100" y="580" width="180" height="180" rx="40" fill="#242424" stroke="#ff5500" stroke-opacity="0.5" stroke-width="2" transform="rotate(-12 1190 670)"/>
    <circle cx="1200" cy="280" r="45" fill="url(#aiCore)"/>
    <circle cx="420" cy="720" r="65" fill="#181818" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <!-- Connecting AI Data Nodes (Lines) -->
  <g stroke="#ff5500" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M420 720 L680 500 L800 500 L1190 670" stroke-dasharray="6 6"/>
    <path d="M1200 280 L800 500" stroke-dasharray="4 4"/>
  </g>

  <!-- Glowing Points -->
  <circle cx="680" cy="500" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="1190" cy="670" r="6" fill="#ff5500" filter="url(#neonGlow)"/>
  <circle cx="420" cy="720" r="6" fill="#ffffff"/>
</svg>
